<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPP — Тренер CRM</title>
    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="icon-192.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }

  body {
    background-color: #07111f !important;
  }

  main > div > .bg-slate-800 {
    background: linear-gradient(145deg, #102438, #0a1726) !important;
    border: 1px solid #25445b !important;
    border-radius: 18px !important;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22) !important;
  }

  main .bg-slate-900.border {
    background-color: #0b1928 !important;
    border-color: #25445b !important;
  }
</style>


<style id="fitpp-refresh-v1">
  :root {
    color-scheme: dark;
    --fitpp-bg: #07111f;
    --fitpp-panel: #0d1b2a;
    --fitpp-card: #0a1624;
    --fitpp-border: #1d354a;
    --fitpp-green: #19e6a0;
    --fitpp-muted: #9db0c4;
  }

  body {
    background:
      radial-gradient(ellipse at 50% -18%, rgba(16,185,129,.13), transparent 42%),
      var(--fitpp-bg) !important;
  }

  header {
    background: rgba(8, 19, 32, .94) !important;
    border-color: var(--fitpp-border) !important;
    backdrop-filter: blur(14px);
  }

  header > div:first-child {
    padding-top: .65rem !important;
    padding-bottom: .65rem !important;
    gap: .65rem !important;
  }

  header h1 {
    letter-spacing: -.035em !important;
    font-weight: 800 !important;
  }

  header nav button {
    border-radius: 999px !important;
    padding: .55rem .9rem !important;
    transition: background .18s ease, transform .18s ease !important;
  }

  header nav button:active,
  main button:active {
    transform: scale(.98);
  }

  main {
    padding-top: 1rem !important;
  }

  main .bg-slate-800.border {
    background: linear-gradient(145deg, rgba(17, 34, 51, .98), rgba(11, 25, 40, .98)) !important;
    border-color: var(--fitpp-border) !important;
    box-shadow: 0 12px 28px rgba(0,0,0,.14) !important;
  }

  main .bg-slate-900.border {
    background: linear-gradient(145deg, #0a1726, #0b1a2a) !important;
    border-color: #1a3349 !important;
  }

  main .text-emerald-400 {
    color: var(--fitpp-green) !important;
  }

  main .rounded-xl,
  main .rounded-2xl {
    border-radius: 1rem !important;
  }

  main button {
    transition: background-color .18s ease, border-color .18s ease, transform .18s ease !important;
  }

 
  main button { -webkit-tap-highlight-color: transparent; }

  @media (max-width: 640px) {
    header > div:first-child {
      display: grid !important;
      grid-template-columns: 1fr auto;
      justify-items: center;
      padding: .45rem .75rem !important;
    }

    header > div:first-child > div:first-child {
      justify-self: start;
    }

    header nav {
      grid-column: 1 / -1;
      grid-row: 2;
      display: flex;
      width: 100%;
      justify-content: space-between;
      gap: .25rem !important;
    }

    header nav button {
      flex: 1;
      padding: .55rem .35rem !important;
      font-size: .82rem !important;
      white-space: nowrap;
    }

    header > div:first-child > div:last-child {
      border-left: 0 !important;
      padding-left: 0 !important;
      justify-self: end;
    }

    main {
      padding: .85rem .75rem 5.5rem !important;
    }

    main > div {
      gap: .85rem !important;
    }

    main .rounded-2xl.p-4 {
      padding: .85rem !important;
      border-radius: 1.1rem !important;
    }

    main .space-y-3 > div {
      padding: .8rem !important;
      gap: .65rem !important;
      border-radius: 1rem !important;
    }

    main .space-y-3 > div > div:last-child {
      gap: .4rem !important;
    }

    main .space-y-3 > div > div:last-child button {
      padding: .55rem .65rem !important;
      border-radius: .7rem !important;
      font-size: .72rem !important;
      line-height: 1.1rem !important;
    }

    main h2 {
      letter-spacing: -.02em;
    }

    input[type="date"] {
      max-width: 100%;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
    }
  }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased" x-data="trainerApp()" x-init="init()">
    <!-- Header -->
    <!-- Auth Banner -->
    <div x-show="!currentUser" class="bg-amber-600/20 border-b border-amber-500/30 px-4 py-2.5 text-center text-sm flex justify-between items-center max-w-4xl mx-auto" x-cloak>
        <span class="text-amber-200 font-medium">Вы не авторизованы. Войдите, чтобы сохранить или синхронизировать данные.</span>
        <button @click="showAuthModal = true" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow">
            <span>Войти / Зарегистрироваться</span>
        </button>
    </div>
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-2">
                <span class="text-2xl"></span>
                <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">FitPP</h1>
            </div>
            <nav class="flex space-x-1 sm:space-x-2">
                <button @click="activeTab = 'journal'" :class="activeTab === 'journal' ? 'bg-emerald-600 text-white' : 'text-slate-300 hover:bg-slate-700'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition">Журнал</button>
                <button @click="activeTab = 'clients'" :class="activeTab === 'clients' ? 'bg-emerald-600 text-white' : 'text-slate-300 hover:bg-slate-700'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition">Клиенты</button>
                <button @click="activeTab = 'finances'" :class="activeTab === 'finances' ? 'bg-emerald-600 text-white' : 'text-slate-300 hover:bg-slate-700'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition">Финансы</button>
            </nav>
            <div class="flex items-center space-x-2 pl-2 border-l border-slate-700">
                <template x-if="currentUser">
                    <div class="flex items-center space-x-2">
                        <span class="text-xs text-slate-300 hidden sm:inline" x-text="currentUser.displayName || currentUser.email"></span>
                        <button @click="logout()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-2.5 py-1.5 rounded-lg transition">Выйти</button>
                    </div>
                </template>
                <template x-if="!currentUser">
                    <button @click="showAuthModal = true" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-1">
                        <span>Войти</span>
                    </button>
                </template>
            </div>
        </div>
    </header>
    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6 pb-24">
        <!-- TAB 1: JOURNAL -->
        <div x-show="activeTab === 'journal'" class="space-y-6">
            <!-- Date & Location Selector -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
                    <div class="flex items-center space-x-3">
                        <button @click="changeDate(-1)" class="p-2 bg-slate-700 hover:bg-slate-600 rounded-xl transition">❮</button>
                        <div class="text-center">
                            <span class="text-xs text-slate-400 block">Дата тренировки</span>
                            <input type="date" x-model="selectedDate" @change="updateLocationByDate()" class="bg-slate-900 border border-slate-600 text-white px-3 py-1 rounded-lg text-sm font-semibold focus:outline-none focus:border-emerald-500">
                        </div>
                        <button @click="changeDate(1)" class="p-2 bg-slate-700 hover:bg-slate-600 rounded-xl transition">❯</button>
                    </div>
                    <button @click="setToday()" class="text-xs bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-xl hover:bg-emerald-600/30 transition">Сегодня</button>
                </div>
                <!-- Location Auto-Detector & Manual Switch -->
                <div>
                    <span class="text-xs text-slate-400 block mb-2">Локация:</span>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <button @click="currentLocation = 'zarya'" :class="currentLocation === 'zarya' ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'" class="border p-2.5 rounded-xl text-sm font-medium text-left transition flex justify-between items-center">
                            <span>мкр. Заря</span>
                            <span class="text-xs opacity-75">Пн, Ср 20:00</span>
                        </button>
                        <button @click="currentLocation = 'pole'" :class="currentLocation === 'pole' ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'" class="border p-2.5 rounded-xl text-sm font-medium text-left transition flex justify-between items-center">
                            <span>Поле чудес</span>
                            <span class="text-xs opacity-75">Вт, Чт 18:30</span>
                        </button>
                        <button @click="currentLocation = 'online'" :class="currentLocation === 'online' ? 'bg-amber-600 text-white border-amber-500' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'" class="border p-2.5 rounded-xl text-sm font-medium text-left transition flex justify-between items-center">
                            <span>Онлайн</span>
                            <span class="text-xs opacity-75">Сб, Вс 18:00</span>
                        </button>
                    </div>
                </div>
            </div>
            <!-- Attendance List -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-lg font-bold" x-text="getLocationTitle()"></h2>
                        <p class="text-xs text-slate-400" x-text="getLocationSchedule()"></p>
                    </div>
                    <span class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300" x-text="getClientsForLocation().length + ' клиентов'"></span>
                </div>
                <div class="space-y-3">
                    <template x-for="client in getClientsForLocation()" :key="client.id">
                        <div class="bg-slate-900 border border-slate-700/60 p-3.5 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
<div class="flex items-center gap-1.5">
    <h3 class="font-semibold text-white" x-text="client.name"></h3>
    <span x-show="getClientActiveSubscription(client).left === 1" class="text-amber-400 text-xs font-semibold bg-amber-400/10 border border-amber-400/30 px-1.5 py-0.5 rounded flex items-center gap-1" title="Осталось 1 занятие">
        ⚠️ Осталось 1 зан.
    </span>
</div>
                                <div class="flex items-center space-x-2 text-xs mt-1">
                                    <span class="text-emerald-400 font-medium" x-text="'Остаток: ' + getClientActiveSubscription(client).left + ' зан.'"></span>
                                    <span class="text-slate-400" x-text="'До: ' + getClientActiveSubscription(client).expires"></span>
                                </div>
                            </div>
                            <div class="flex flex-wrap items-center gap-1.5 w-full sm:w-auto">
                                <button @click="markAttendance(client.id, 'attended')" :class="getAttendanceStatus(client.id) === 'attended' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition">✓ Был (-1)</button>
                                <button @click="markAttendance(client.id, 'razov')" :class="getAttendanceStatus(client.id) === 'razov' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition" x-text="'₽ Разово (' + getRazovPrice() + ')'"></button>
                                <button @click="markAttendance(client.id, 'missed')" :class="getAttendanceStatus(client.id) === 'missed' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition">Сгорело</button>
                                <button @click="markAttendance(client.id, 'excused')" :class="getAttendanceStatus(client.id) === 'excused' ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition">Уваж.</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        <!-- TAB 2: CLIENTS -->
        <div x-show="activeTab === 'clients'" class="space-y-6">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg flex justify-between items-center">
                <h2 class="text-lg font-bold">База клиентов</h2>
                <button @click="openClientModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">+ Новый клиент</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <template x-for="client in clients" :key="client.id">
                    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-white text-base" x-text="client.name"></h3>
                                <button @click="editClient(client)" class="text-slate-400 hover:text-white text-xs bg-slate-700 px-2 py-1 rounded-lg">Изменить</button>
                            </div>
                            <p class="text-xs text-slate-400 mt-1" x-text="'Телефон: ' + (client.phone || 'не указан')"></p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-700/60 flex justify-between items-center">
                            <div>
                                <span class="text-xs text-slate-400 block">Абонемент:</span>
<div class="flex items-center gap-1.5">
    <span class="text-sm font-semibold text-emerald-400" x-text="getClientSubInfo(client)"></span>
    <span x-show="getClientActiveSubscription(client).left === 1" class="text-amber-400 text-xs font-semibold bg-amber-400/10 border border-amber-400/30 px-1.5 py-0.5 rounded flex items-center gap-1" title="Осталось 1 занятие">
        ⚠️ 1 зан.
    </span>
</div>
                            </div>
                            <button @click="openSubModal(client)" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-xl text-xs font-medium transition">+ Продать</button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
        <!-- TAB 3: FINANCES -->
        <div x-show="activeTab === 'finances'" class="space-y-6">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-bold">Финансовый отчёт и аренда</h2>
                    <div class="flex items-center space-x-2 bg-slate-900 border border-slate-700 px-3 py-1 rounded-xl">
                        <button @click="changeMonth(-1)" class="text-slate-400 hover:text-white">❮</button>
                        <span class="text-sm font-semibold text-emerald-400" x-text="formatMonthName(currentMonth)"></span>
                        <button @click="changeMonth(1)" class="text-slate-400 hover:text-white">❯</button>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                    <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl">
                        <span class="text-xs text-slate-400 block">Доходы (Всего)</span>
                        <span class="text-xl font-bold text-emerald-400 mt-1 block" x-text="getMonthIncome() + ' ₽'"></span>
                    </div>
                    <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl">
                        <span class="text-xs text-slate-400 block">Расходы (Аренда залов)</span>
                        <span class="text-xl font-bold text-rose-400 mt-1 block" x-text="getMonthRent() + ' ₽'"></span>
                    </div>
                    <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl">
                        <span class="text-xs text-slate-400 block">Чистая прибыль</span>
                        <span class="text-xl font-bold text-teal-300 mt-1 block" x-text="getMonthProfit() + ' ₽'"></span>
                    </div>
                </div>
            </div>
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-md font-bold text-rose-400">Опасная зона</h3>
                    <button @click="clearDatabase()" class="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">Сбросить базу данных</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Client Modal -->
    <div x-show="showClientModal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold" x-text="editingClient ? 'Редактировать клиента' : 'Новый клиент'"></h3>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Имя и фамилия</label>
                <input type="text" x-model="clientForm.name" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Телефон</label>
                <input type="text" x-model="clientForm.phone" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Локации:</label>
                <div class="space-y-2 mt-1">
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" value="zarya" x-model="clientForm.locations" class="rounded bg-slate-900 border-slate-600 text-emerald-600"><span>мкр. Заря</span></label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" value="pole" x-model="clientForm.locations" class="rounded bg-slate-900 border-slate-600 text-emerald-600"><span>Поле чудес</span></label>
                    <label class="flex items-center space-x-2 text-sm"><input type="checkbox" value="online" x-model="clientForm.locations" class="rounded bg-slate-900 border-slate-600 text-emerald-600"><span>Онлайн тренировки</span></label>
                </div>
            </div>
            <!-- История посещений -->
            <template x-if="editingClient">
                <div class="pt-3 border-t border-slate-700/60">
                    <label class="text-xs text-slate-400 block mb-2">История посещений:</label>
                    <div class="max-h-40 overflow-y-auto space-y-1.5 pr-1">
                        <template x-for="item in getClientAttendanceHistory(editingClient.id)">
                            <div class="flex justify-between items-center bg-slate-900 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs">
                                <span class="text-slate-300 font-medium" x-text="item.date"></span>
                                <span class="border px-2 py-0.5 rounded-lg" :class="item.badgeClass" x-text="item.text"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
            <div class="flex justify-between items-center pt-2 border-t border-slate-700/60">
                <button x-show="editingClient" @click="deleteClient()" class="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition">Удалить</button>
                <div class="flex space-x-3 ml-auto">
                    <button @click="showClientModal = false" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-sm font-medium transition">Отмена</button>
                    <button @click="saveClient()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-xl text-sm font-semibold transition">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Subscription Modal -->
    <div x-show="showSubModal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold">Продажа абонемента</h3>
            <p class="text-xs text-slate-400" x-text="'Клиент: ' + (subClient ? subClient.name : '')"></p>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Тип абонемента</label>
                <select x-model="subForm.type" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-sm text-white">
                    <option value="zarya">мкр. Заря (8 занятий) — 4400 ₽</option>
                    <option value="pole">Поле чудес (8 занятий) — 3800 ₽</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1">Дата продажи</label>
                <input type="date" x-model="subForm.date" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-sm text-white">
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button @click="showSubModal = false" class="bg-slate-700 px-4 py-2 rounded-xl text-sm">Отмена</button>
                <button @click="saveSubscription()" class="bg-emerald-600 px-4 py-2 rounded-xl text-sm font-semibold">Оформить</button>
            </div>
        </div>
    </div>
    <!-- Auth Modal -->
    <div x-show="showAuthModal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
<h3 class="text-lg font-bold text-white">Вход в аккаунт</h3>
                <button @click="showAuthModal = false" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Email</label>
                    <input type="email" x-model="authForm.email" placeholder="example@mail.com" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Пароль</label>
                    <input type="password" x-model="authForm.password" placeholder="••••••••" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div x-show="authError" class="text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 p-2.5 rounded-xl" x-text="authError"></div>
            </div>
            <div class="flex flex-col gap-2 pt-2">
<button @click="handleAuth()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-sm font-semibold transition">Войти</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD29YmR0LiS-YaV2GZ2c5tXM8t1ibNhJKk",
            authDomain: "fitpp-crm.firebaseapp.com",
            projectId: "fitpp-crm",
            storageBucket: "fitpp-crm.firebasestorage.app",
            messagingSenderId: "1075119383188",
            appId: "1:1075119383188:web:21494fbfc98b331b92ca81"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function trainerApp() {
            return {
                activeTab: 'journal',
                selectedDate: new Date().toISOString().slice(0, 10),
                currentMonth: new Date().toISOString().slice(0, 7),
                currentLocation: 'zarya',
                currentUser: null,
                clients: [],
                attendance: {},
                finances: {},
                showAuthModal: false,
                authMode: 'login',
                authForm: { email: '', password: '' },
                authError: '',
                showClientModal: false,
                editingClient: null,
                clientForm: { id: null, name: '', phone: '', locations: ['zarya'] },
                showSubModal: false,
                subClient: null,
                subForm: { type: 'zarya', date: new Date().toISOString().slice(0, 10) },
                updateLocationByDate() {
                    let d = new Date(this.selectedDate);
                    let day = d.getDay();
                    if (day === 1 || day === 3) this.currentLocation = 'zarya';
                    else if (day === 2 || day === 4) this.currentLocation = 'pole';
                    else if (day === 6 || day === 0) this.currentLocation = 'online';
                },
                changeDate(dir) {
                    let d = new Date(this.selectedDate);
                    d.setDate(d.getDate() + dir);
                    this.selectedDate = d.toISOString().slice(0, 10);
                    this.updateLocationByDate();
                },
                setToday() {
                    this.selectedDate = new Date().toISOString().slice(0, 10);
                    this.updateLocationByDate();
                },
                getLocationTitle() {
                    if (this.currentLocation === 'zarya') return 'мкр. Заря (Пн, Ср 20:00)';
                    if (this.currentLocation === 'pole') return 'Поле чудес (Вт, Чт 18:30)';
                    return 'Онлайн тренировки (Сб, Вс 18:00)';
                },
                getLocationSchedule() {
                    return 'Дата: ' + this.selectedDate;
                },
                getClientsForLocation() {
                    return this.clients.filter(c => c.locations && c.locations.includes(this.currentLocation));
                },
                getClientActiveSubscription(client) {
                    if (!client || !client.subscriptions || client.subscriptions.length === 0) return null;
                    // Ищем первый абонемент, где есть занятия
                    let active = client.subscriptions.find(s => s.left > 0);
                    // Если такого нет, возвращаем последний, чтобы показать "0"
                    return active || client.subscriptions[client.subscriptions.length - 1];
                },
                getClientSubInfo(client) {
                    if (!client) return 'Нет данных';
                    let sub = this.getClientActiveSubscription(client);
                    return sub.left > 0 ? (sub.left + ' зан. (до ' + sub.expires + ')') : 'Нет активного абонемента';
                },
                getAttendanceStatus(clientId) {
                    if (!this.attendance[this.selectedDate]) return null;
                    return this.attendance[this.selectedDate][clientId] || null;
                },
                getRazovPrice() {
                    return this.currentLocation === 'zarya' ? 700 : (this.currentLocation === 'pole' ? 600 : 500);
                },

                init() {
                    firebase.auth().onAuthStateChanged((user) => {
                        this.currentUser = user;
                        if (user) {
                            this.loadFromFirebase();
                        }
                    });
                },
                async syncToFirebase() {
                    if (!this.currentUser) return;
                    try {
                        await db.collection('trainers').doc(this.currentUser.uid).set({
                            clients: this.clients,
                            attendance: this.attendance,
                            finances: this.finances
                        }, { merge: true });
                    } catch (error) {
                        console.error("Ошибка сохранения в Firebase:", error);
                    }
                },
                async loadFromFirebase() {
    if (!this.currentUser) return;
    try {
        const doc = await db.collection('trainers').doc(this.currentUser.uid).get();
        if (doc.exists) {
            const data = doc.data();
            this.clients = data.clients || [];
            this.attendance = data.attendance || {};
            this.finances = data.finances || {};
        } else {
            this.clients = [];
            this.attendance = {};
            this.finances = {};
        }
    } catch (error) {
        console.error("Ошибка загрузки из Firebase:", error);
    }
},
                async logout() {
                    try {
                        await firebase.auth().signOut();
                        this.currentUser = null;
                        this.clients = [];
                        this.attendance = {};
                        this.finances = {};
                    } catch (error) {
                        console.error("Ошибка при выходе:", error);
                    }
                },
                async handleAuth() {
    this.authError = '';
    try {
        // Оставляем только вход по email и паролю
        await firebase.auth().signInWithEmailAndPassword(this.authForm.email, this.authForm.password);
        this.showAuthModal = false;
        this.authForm = { email: '', password: '' };
    } catch (error) {
        console.error("Ошибка авторизации:", error);
        this.authError = error.message;
    }
},
markAttendance(clientId, status) {
                    if (!this.attendance[this.selectedDate]) this.attendance[this.selectedDate] = {};
                    let client = this.clients.find(c => c.id === clientId);
                    if (!client) return;
                    
                    let sub = this.getClientActiveSubscription(client);
                    let prevStatus = this.attendance[this.selectedDate][clientId];
                    
                    // Если нажали на ту же кнопку — отменяем действие
                    if (prevStatus === status) {
                        if (status === 'attended' && sub && sub.left !== undefined) {
                            sub.left++; // Возвращаем занятие
                        }
                        if (status === 'razov') {
                            let price = this.getRazovPrice();
                            let monthKey = this.selectedDate.slice(0, 7);
                            if (this.finances[monthKey]) {
                                this.finances[monthKey] = Math.max(0, this.finances[monthKey] - price);
                            }
                        }
                        delete this.attendance[this.selectedDate][clientId];
                    } else {
                        // Возврат, если меняем статус с "Был" на другой
                        if (prevStatus === 'attended' && sub && sub.left !== undefined) {
                            sub.left++;
                        }
                        
                        // Списание, если ставим "Был"
                        if (status === 'attended') {
                            if (sub && sub.left > 0) {
                                sub.left--;
                            } else {
                                if (confirm('У клиента нет доступных занятий в абонементе. Оформить новый абонемент?')) {
                                    this.openSubModal(client);
                                }
                                return; // Прерываем, если нет абонемента
                            }
                        }
                        
                        this.attendance[this.selectedDate][clientId] = status;
                        
                        // Логика финансов для разовых
                        let monthKey = this.selectedDate.slice(0, 7);
                        if (!this.finances[monthKey]) this.finances[monthKey] = 0;
                        
                        if (status === 'razov' && prevStatus !== 'razov') {
                            this.finances[monthKey] += this.getRazovPrice();
                        } else if (prevStatus === 'razov' && status !== 'razov') {
                            this.finances[monthKey] = Math.max(0, this.finances[monthKey] - this.getRazovPrice());
                        }
                    }
                    
                    this.clients = [...this.clients];
                    this.attendance = { ...this.attendance };
                    this.finances = { ...this.finances };
                    this.syncToFirebase();
                },

                getClientAttendanceHistory(clientId) {
                    let history = [];
                    for (let date in this.attendance) {
                        if (this.attendance[date][clientId]) {
                            let status = this.attendance[date][clientId];
                            let statusText = '';
                            let badgeClass = '';
                            if (status === 'attended') { statusText = 'Был'; badgeClass = 'bg-emerald-600/20 text-emerald-400'; }
                            else if (status === 'razov') { statusText = 'Разовое'; badgeClass = 'bg-blue-600/20 text-blue-400'; }
                            else if (status === 'missed') { statusText = 'Сгорело'; badgeClass = 'bg-rose-600/20 text-rose-400'; }
                            else if (status === 'excused') { statusText = 'Уваж.'; badgeClass = 'bg-amber-600/20 text-amber-400'; }
                            history.push({ date: date, text: statusText, badgeClass: badgeClass });
                        }
                    }
                    return history.sort((a, b) => new Date(b.date) - new Date(a.date));
                },
                openClientModal() {
                    this.editingClient = null;
                    this.clientForm = { id: Date.now(), name: '', phone: '', locations: ['zarya'] };
                    this.showClientModal = true;
                },
                editClient(client) {
                    this.editingClient = client;
                    this.clientForm = { ...client };
                    if(!this.clientForm.locations) this.clientForm.locations = [];
                    this.showClientModal = true;
                },
                saveClient() {
                    if (this.editingClient) {
                        let idx = this.clients.findIndex(c => c.id === this.editingClient.id);
                        if (idx !== -1) this.clients[idx] = { ...this.clientForm };
                    } else {
                        this.clients.push({ ...this.clientForm });
                    }
                    this.syncToFirebase();
                    this.showClientModal = false;
                },
                deleteClient() {
                    if(confirm('Удалить клиента?')) {
                        this.clients = this.clients.filter(c => c.id !== this.editingClient.id);
                        this.syncToFirebase();
                        this.showClientModal = false;
                    }
                },
                openSubModal(client) {
                    this.subClient = client;
                    this.subForm.date = this.selectedDate;
                    this.showSubModal = true;
                },
                saveSubscription() {
                    if (!this.subClient) return;
                    if (!this.subClient.subscriptions) this.subClient.subscriptions = [];
                    let price = this.subForm.type === 'zarya' ? 4400 : 3800;
                    let subDate = this.subForm.date || this.selectedDate;
                    let endDate = new Date(subDate);
                    endDate.setDate(endDate.getDate() + 28);
                    this.subClient.subscriptions.push({ left: 8, startDate: subDate, expires: endDate.toISOString().slice(0, 10), price: price });
                    
                    let monthKey = subDate.slice(0, 7);
                    if (!this.finances[monthKey]) this.finances[monthKey] = 0;
                    this.finances[monthKey] = (this.finances[monthKey] || 0) + price;
                    this.finances = { ...this.finances };
                    this.syncToFirebase();
                    this.showSubModal = false;
                },
                changeMonth(dir) {
                    let [y, m] = this.currentMonth.split('-').map(Number);
                    let d = new Date(y, m - 1 + dir, 1);
this.currentMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;                },
                formatMonthName(monthStr) {
                    let [y, m] = monthStr.split('-');
                    let months = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
                    return `${months[Number(m)-1]} ${y} г.`;
                },
                getMonthIncome() { return this.finances[this.currentMonth] || 0; },
                getMonthRent() {
                    let [year, month] = this.currentMonth.split('-').map(Number);
                    let daysInMonth = new Date(year, month, 0).getDate();
                    let totalRent = 0;
                    for (let day = 1; day <= daysInMonth; day++) {
                        let currentDate = new Date(year, month - 1, day);
                        let dayOfWeek = currentDate.getDay();
                        if (dayOfWeek === 1 || dayOfWeek === 3) {
                            if (currentDate >= new Date('2026-09-07T00:00:00')) { totalRent += 800; }
                        } else if (dayOfWeek === 2 || dayOfWeek === 4) {
                            if (currentDate >= new Date('2026-09-01T00:00:00')) { totalRent += 600; }
                        }
                    }
                    return totalRent;
                },
                getMonthProfit() { return this.getMonthIncome() - this.getMonthRent(); },
                clearDatabase() {
                    if (confirm('Вы уверены, что хотите сбросить всю базу данных? Это действие нельзя отменить.')) {
                        this.clients = [];
                        this.attendance = {};
                        this.finances = {};
                        this.syncToFirebase();
                    }
                },
            }
        }
    </script>
</body>
</html>
