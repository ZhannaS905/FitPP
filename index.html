<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPP — Тренер CRM</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased" x-data="trainerApp()">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🏋️‍♂️</span>
                <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">FitPP</h1>
            </div>
            <nav class="flex space-x-1 sm:space-x-2">
                <button @click="activeTab = 'journal'" :class="activeTab === 'journal' ? 'bg-emerald-600 text-white' : 'text-slate-300 hover:bg-slate-700'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition">Журнал</button>
                <button @click="activeTab = 'clients'" :class="activeTab === 'clients' ? 'bg-emerald-600 text-white' : 'text-slate-300 hover:bg-slate-700'" class="px-3 py-1.5 rounded-lg text-sm font-medium transition">Клиенты</button>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 pb-24">
        <!-- TAB 1: JOURNAL -->
        <div x-show="activeTab === 'journal'" class="space-y-6">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
                    <div class="flex items-center space-x-3">
                        <button @click="changeDate(-1)" class="p-2 bg-slate-700 hover:bg-slate-600 rounded-xl transition">❮</button>
                        <div class="text-center">
                            <span class="text-xs text-slate-400 block">Дата тренировки</span>
                            <input type="date" x-model="selectedDate" @change="loadDayData()" class="bg-slate-900 border border-slate-600 text-white px-3 py-1 rounded-lg text-sm font-semibold focus:outline-none focus:border-emerald-500">
                        </div>
                        <button @click="changeDate(1)" class="p-2 bg-slate-700 hover:bg-slate-600 rounded-xl transition">❯</button>
                    </div>
                </div>
            </div>
            
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg">
                <div class="space-y-3">
                    <template x-for="client in clients" :key="<unsafe_url>client.id</unsafe_url>">
                        <div class="bg-slate-900 border border-slate-700/60 p-3.5 rounded-xl flex justify-between items-center">
                            <div>
                                <h3 class="font-semibold text-white" x-text="client.name"></h3>
                                <span class="text-xs text-emerald-400" x-text="'Остаток: ' + getClientActiveSubscription(client).left"></span>
                            </div>
                            <div class="flex gap-1.5">
                                <button @click="markAttendance(<unsafe_url>client.id</unsafe_url>, 'attended')" :class="getAttendanceStatus(<unsafe_url>client.id</unsafe_url>) === 'attended' ? 'bg-emerald-600' : 'bg-slate-800'" class="px-2.5 py-1.5 rounded-lg text-xs">Был</button>
                                <button @click="markAttendance(<unsafe_url>client.id</unsafe_url>, 'missed')" :class="getAttendanceStatus(<unsafe_url>client.id</unsafe_url>) === 'missed' ? 'bg-rose-600' : 'bg-slate-800'" class="px-2.5 py-1.5 rounded-lg text-xs">Сгорело</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- TAB 2: CLIENTS -->
        <div x-show="activeTab === 'clients'" class="space-y-6">
            <button @click="openClientModal()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm">+ Новый клиент</button>
            <template x-for="client in clients" :key="<unsafe_url>client.id</unsafe_url>">
                <div class="bg-slate-800 p-4 rounded-2xl flex justify-between items-center">
                    <span x-text="client.name"></span>
                    <button @click="deleteClient(<unsafe_url>client.id</unsafe_url>)" class="text-rose-400 text-xs">Удалить</button>
                </div>
            </template>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD29YmR0LiS-YaV2GZ2c5tXM8t1ibNhJKk",
            authDomain: "<unsafe_url>fitpp-crm.firebaseapp.com</unsafe_url>",
            projectId: "fitpp-crm",
            storageBucket: "fitpp-crm.firebasestorage.app",
            messagingSenderId: "1075119383188",
            appId: "1:1075119383188:web:21494fbfc98b331b92ca81"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function trainerApp() {
            return {
                activeTab: 'journal',
                selectedDate: new Date().toISOString().slice(0, 10),
                clients: [],
                attendance: {},
                
                init() { this.loadFromFirebase(); },
                loadDayData() {},
                loadFromFirebase() {
                    db.collection('appData').doc('main').onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.clients) this.clients = data.clients;
                            if (data.attendance) this.attendance = data.attendance;
                        }
                    });
                },
                syncToFirebase() {
                    db.collection('appData').doc('main').set({ clients: this.clients, attendance: this.attendance });
                },
                changeDate(days) {
                    let d = new Date(this.selectedDate);
                    d.setDate(d.getDate() + days);
                    this.selectedDate = d.toISOString().slice(0, 10);
                },
                getClientActiveSubscription(client) {
                    return client.subscriptions && client.subscriptions.length > 0 ? client.subscriptions[client.subscriptions.length - 1] : { left: 0 };
                },
                getAttendanceStatus(clientId) {
                    return this.attendance[this.selectedDate] ? this.attendance[this.selectedDate][clientId] : null;
                },
                markAttendance(clientId, status) {
                    if (!this.attendance[this.selectedDate]) this.attendance[this.selectedDate] = {};
                    let client = this.clients.find(c => <unsafe_url>c.id</unsafe_url> === clientId);
                    let sub = this.getClientActiveSubscription(client);
                    
                    if (this.attendance[this.selectedDate][clientId] === status) {
                        this.attendance[this.selectedDate][clientId] = null;
                        if (status === 'attended') sub.left++;
                    } else {
                        if (this.attendance[this.selectedDate][clientId] === 'attended') sub.left++;
                        this.attendance[this.selectedDate][clientId] = status;
                        if (status === 'attended') sub.left--;
                    }
                    this.syncToFirebase();
                },
                openClientModal() {
                    let name = prompt("Имя клиента:");
                    if (name) {
                        this.clients.push({ id: Date.now(), name: name, subscriptions: [{ left: 8 }] });
                        this.syncToFirebase();
                    }
                },
                deleteClient(id) {
                    this.clients = this.clients.filter(c => <unsafe_url>c.id</unsafe_url> !== id);
                    this.syncToFirebase();
                }
            }
        }
    </script>
</body>
</html>
